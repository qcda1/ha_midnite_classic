title: Classic
views:
  - title: Console
    path: console
    icon: mdi:solar-power-variant
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ## RÉSEAU MIDNITE CLASSIC


              {% set p = states('sensor.classic_puissance_combinee') | float(0)
              %}

              {% set soc = states('sensor.classic1_state_of_charge') | float(0) %}

              {% set gen = states('binary_sensor.classic1_aux_1_state_on') %}

              {%- if gen == 'on' -%}GÉNÉRATRICE EN MARCHE

              {%- elif p > 50 -%}RÉCOLTE EN COURS

              {%- else -%}REPOS{%- endif -%}

              &nbsp;·&nbsp; BATT {{ soc | round(0) }} %

              &nbsp;·&nbsp; {{ p | round(0) }} W

              &nbsp;·&nbsp; {{ states('sensor.classic1_charge_state_text') |
              upper }}
            card_mod:
              style:
                ha-markdown:
                  $: |
                    h2 {
                      font-size: 15px !important;
                      letter-spacing: 0.34em !important;
                      text-transform: uppercase;
                      color: var(--classic-phosphor, #7FE3C4) !important;
                      font-weight: 400 !important;
                      margin: 0 0 6px 0 !important;
                    }
                    p {
                      font-family: var(--classic-mono);
                      font-size: 12px !important;
                      letter-spacing: 0.14em;
                      color: var(--secondary-text-color) !important;
                      margin: 0 !important;
                    }
                .: |
                  ha-card {
                    background: linear-gradient(180deg,
                      rgba(127,227,196,0.07) 0%, rgba(13,22,32,0) 70%),
                      var(--classic-panel, #0D1620);
                    border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                    border-left: 2px solid var(--classic-phosphor, #7FE3C4);
                    padding: 14px 18px;
                  }
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: |
                      ## {{ states('sensor.classic1_device_name') }}
                    card_mod:
                      style:
                        ha-markdown:
                          $: |
                            h2 {
                              font-size: 12px !important;
                              letter-spacing: 0.26em !important;
                              font-weight: 400 !important;
                              text-transform: uppercase;
                              color: var(--classic-phosphor, #7FE3C4) !important;
                              margin: 0 !important;
                            }
                        .: |
                          ha-card {
                            background: var(--classic-panel, #0D1620);
                            border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                            border-bottom: none;
                            padding: 10px 16px 8px 16px;
                          }
                  - type: gauge
                    entity: sensor.classic1_power
                    name: PUISSANCE
                    unit: W
                    min: 0
                    max: 1400
                    needle: true
                    severity:
                      green: 0
                      yellow: 900
                      red: 1200
                    card_mod:
                      style: |
                        ha-card {
                          position: relative;
                          background: linear-gradient(180deg,
                            rgba(127,227,196,0.04) 0%, rgba(13,22,32,0) 55%),
                            var(--classic-panel, #0D1620);
                          border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                        }
                        ha-card::before, ha-card::after {
                          content: ""; position: absolute;
                          width: 9px; height: 9px;
                          border-color: var(--classic-phosphor, #7FE3C4);
                          opacity: 0.45; pointer-events: none;
                        }
                        ha-card::before {
                          top: 0; left: 0;
                          border-top: 1px solid; border-left: 1px solid;
                        }
                        ha-card::after {
                          bottom: 0; right: 0;
                          border-bottom: 1px solid; border-right: 1px solid;
                        }
                  - type: markdown
                    content: |
                      **REG 4116 · 4118 · 4127**

                      JOUR `{{ states('sensor.classic1_energy_today') }} kWh`

                      CUMUL `{{ states('sensor.classic1_total_energy') }} kWh`

                      ÉTAGE `{{ states('sensor.classic1_charge_state_text') }}`

                      MPPT `{{ states('sensor.classic1_mppt_mode_text') }}`

                      FET `{{ states('sensor.classic1_fet_temperature') }} °C`
                    card_mod:
                      style:
                        ha-markdown:
                          $: |
                            p {
                              display: flex;
                              align-items: baseline;
                              justify-content: space-between;
                              gap: 12px;
                              white-space: nowrap;
                              font-size: 11.5px !important;
                              letter-spacing: 0.08em;
                              color: var(--secondary-text-color) !important;
                              margin: 0 0 6px 0 !important;
                            }
                            p:first-of-type {
                              display: block;
                              font-size: 10px !important;
                              letter-spacing: 0.22em;
                              color: var(--classic-pixel, #4B4FC4) !important;
                              margin-bottom: 12px !important;
                            }
                            p:last-of-type { margin-bottom: 0 !important; }
                            strong { font-weight: 400 !important; }
                            code {
                              font-family: var(--classic-mono);
                              background: rgba(127,227,196,0.07) !important;
                              color: var(--classic-phosphor, #7FE3C4) !important;
                              padding: 1px 6px !important;
                              border-radius: 2px;
                              /* La valeur peut rétrécir et se couper plutôt
                                 que de déborder : « Reason For Resting » peut
                                 faire 149 caractères. */
                              flex: 0 1 auto;
                              min-width: 0;
                              overflow: hidden;
                              text-overflow: ellipsis;
                            }
                        .: |
                          ha-card {
                            background: var(--classic-panel, #0D1620);
                            border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                            padding: 12px 16px;
                          }
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: |
                      ## COMBINÉ
                    card_mod:
                      style:
                        ha-markdown:
                          $: |
                            h2 {
                              font-size: 12px !important;
                              letter-spacing: 0.26em !important;
                              font-weight: 400 !important;
                              text-transform: uppercase;
                              color: var(--classic-phosphor, #7FE3C4) !important;
                              margin: 0 !important;
                            }
                        .: |
                          ha-card {
                            background: var(--classic-panel, #0D1620);
                            border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                            border-bottom: none;
                            padding: 10px 16px 8px 16px;
                          }
                  - type: markdown
                    content: >
                      {% set p = states('sensor.classic_puissance_combinee') |
                      float(0) %}

                      {% set r = states('sensor.classic_recolte_jour') |
                      float(0) %}

                      {% set pmax = 2600 %}

                      {% set rmax = 30 %}

                      # {{ p | round(0) }} W


                      {{ (100 * p / pmax) | round(0) }} % DE {{ pmax }} W


                      RÉCOLTE JOUR {{ r }} kWh · {{ (100 * r / rmax) | round(0) }} %
                      DE {{ rmax }} kWh


                      CUMUL {{ states('sensor.classic_energie_cumulee') }} kWh
                    card_mod:
                      style:
                        ha-markdown:
                          $: |
                            h1 {
                              font-family: var(--classic-mono);
                              font-size: 46px !important;
                              line-height: 1 !important;
                              font-weight: 300 !important;
                              letter-spacing: -0.01em;
                              color: var(--classic-phosphor, #7FE3C4) !important;
                              text-align: center;
                              margin: 0 0 10px 0 !important;
                              text-shadow: 0 0 22px rgba(127,227,196,0.35);
                            }
                            p {
                              font-family: var(--classic-mono);
                              font-size: 14px !important;
                              line-height: 1.5 !important;
                              letter-spacing: 0.10em;
                              text-align: center;
                              color: #CFEDE4 !important;
                              margin: 0 0 8px 0 !important;
                            }
                            p:last-of-type { margin-bottom: 0 !important; }
                        .: |
                          ha-card {
                            background: var(--classic-panel, #0D1620);
                            border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                            border-top: 2px solid var(--classic-phosphor, #7FE3C4);
                            padding: 40px 16px;
                          }
              - type: vertical-stack
                cards:
                  - type: markdown
                    content: |
                      ## {{ states('sensor.classic2_device_name') }}
                    card_mod:
                      style:
