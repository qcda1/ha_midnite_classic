                                 faire 149 caractères. */
                              flex: 0 1 auto;
                              min-width: 0;
                              overflow: hidden;
                              text-overflow: ellipsis;
                            }
                        .: |
                          ha-card {
                            background: var(--classic-panel, #0D1620);
                            border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                            padding: 12px 16px;
                          }
          - type: markdown
            content: '## BANQUE DE BATTERIES · REG 4360-4383'
            card_mod:
              style:
                ha-markdown:
                  $: |
                    h2 {
                      font-size: 11px !important;
                      letter-spacing: 0.30em !important;
                      font-weight: 400 !important;
                      color: var(--classic-phosphor-dim, #2E6A5E) !important;
                      margin: 0 !important;
                      text-transform: uppercase;
                    }
                .: |
                  ha-card {
                    background: transparent;
                    border: none;
                    border-bottom: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                    box-shadow: none;
                    padding: 18px 4px 6px 4px;
                  }
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.classic1_state_of_charge
                name: ÉTAT DE CHARGE
                unit: '%'
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 50
                  green: 80
                card_mod:
                  style: |
                    ha-card {
                      position: relative;
                      background: linear-gradient(180deg,
                        rgba(127,227,196,0.04) 0%, rgba(13,22,32,0) 55%),
                        var(--classic-panel, #0D1620);
                      border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                    }
                    ha-card::before, ha-card::after {
                      content: ""; position: absolute;
                      width: 9px; height: 9px;
                      border-color: var(--classic-phosphor, #7FE3C4);
