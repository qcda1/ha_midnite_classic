                        background: var(--classic-panel, #0D1620);
                        border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                        padding: 12px 16px;
                      }
          - type: custom:apexcharts-card
            header:
              show: true
              title: ÉTAT DE CHARGE ET COURANT BATT
              show_states: false
            graph_span: 24h
            span:
              end: minute
            apex_config:
              chart:
                height: 220
                background: transparent
              grid:
                borderColor: rgba(75,79,196,0.20)
                strokeDashArray: 3
              legend:
                show: true
                position: top
                horizontalAlign: right
              yaxis:
                - id: soc
                  min: 0
                  max: 100
                  decimalsInFloat: 0
                  title:
                    text: '%'
                - id: courant
                  opposite: true
                  decimalsInFloat: 0
                  title:
                    text: A
            series:
              - entity: sensor.classic1_state_of_charge
                name: État de charge
                yaxis_id: soc
                type: line
                curve: smooth
                stroke_width: 2
                color: '#7FE3C4'
              - entity: sensor.classic1_whizbang_battery_current
                name: Courant batt
                yaxis_id: courant
                type: area
                curve: smooth
