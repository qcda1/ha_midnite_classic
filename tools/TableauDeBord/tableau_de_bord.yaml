                  Le relais est fermé. Arrêt lorsque l'état de charge dépasse

                  {{ states('sensor.classic1_aux_1_high_threshold') }} %,

                  puis {{ states('sensor.classic1_aux_1_delay_time') }} s de
                  délai.

                  {%- else -%}

                  Marge avant démarrage : {{ m | round(0) }} points d'état de
