                        }
                        ha-card::after {
                          bottom: 0; right: 0;
                          border-bottom: 1px solid; border-right: 1px solid;
                        }
                  - type: markdown
                    content: |
                      **REG 4116 · 4118 · 4127**

                      JOUR `{{ states('sensor.classic2_energy_today') }} kWh`

                      CUMUL `{{ states('sensor.classic2_total_energy') }} kWh`

                      ÉTAGE `{{ states('sensor.classic2_charge_state_text') }}`

                      MPPT `{{ states('sensor.classic2_mppt_mode_text') }}`

                      FET `{{ states('sensor.classic2_fet_temperature') }} °C`
                    card_mod:
                      style:
                        ha-markdown:
