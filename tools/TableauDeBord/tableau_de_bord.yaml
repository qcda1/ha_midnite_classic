                    }
                    ha-card::before {
                      top: 0; left: 0;
                      border-top: 1px solid; border-left: 1px solid;
                    }
                    ha-card::after {
                      bottom: 0; right: 0;
                      border-bottom: 1px solid; border-right: 1px solid;
                    }
              - type: gauge
                entity: sensor.classic1_whizbang_battery_current
                name: COURANT BATT
                unit: A
                min: -150
                max: 150
                needle: true
                card_mod:
                  style: |
                    ha-card {
                      position: relative;
                      background: linear-gradient(180deg,
                        rgba(127,227,196,0.04) 0%, rgba(13,22,32,0) 55%),
                        var(--classic-panel, #0D1620);
                      border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                    }
                    ha-card::before, ha-card::after {
                      content: ""; position: absolute;
                      width: 9px; height: 9px;
                      border-color: var(--classic-phosphor, #7FE3C4);
                      opacity: 0.45; pointer-events: none;
                    }
                    ha-card::before {
                      top: 0; left: 0;
                      border-top: 1px solid; border-left: 1px solid;
                    }
                    ha-card::after {
                      bottom: 0; right: 0;
                      border-bottom: 1px solid; border-right: 1px solid;
                    }
              - type: markdown
                content: >
                  **BILAN WHIZBANG JR**


                  SENS `{{ states('sensor.banque_sens_du_courant') }}`


                  PUISSANCE `{{ states('sensor.banque_puissance_nette') }} W`


                  Ah RESTE `{{ states('sensor.classic1_remaining_amp_hours') }}
                  Ah`


                  Ah TOTAL `{{ states('sensor.classic1_total_amp_hours') }} Ah`


                  Ah NET `{{ states('sensor.classic1_wbjr_amp_hours_net') }} Ah`


                  ENTRÉE `{{ states('sensor.banque_energie_accumulee') }} kWh`


                  SORTIE `{{ states('sensor.banque_energie_fournie') }} kWh`


                  TEMP. `{{ states('sensor.classic1_battery_temperature') }} °C`
                card_mod:
                  style:
                    ha-markdown:
                      $: |
