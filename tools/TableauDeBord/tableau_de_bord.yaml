                entity: sensor.classic1_battery_voltage
                name: TENSION BATT
                unit: V
                min: 44
                max: 62
                needle: true
                severity:
                  red: 44
                  yellow: 47
                  green: 50
                card_mod:
                  style: |
                    ha-card {
                      position: relative;
                      background: linear-gradient(180deg,
                        rgba(127,227,196,0.04) 0%, rgba(13,22,32,0) 55%),
                        var(--classic-panel, #0D1620);
                      border: 1px solid var(--classic-hairline, rgba(127,227,196,0.16));
                    }
                    ha-card::before, ha-card::after {
